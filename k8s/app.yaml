apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-application
  labels:
    app: cloud-application
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-application
  template:
    metadata:
      labels:
        app: cloud-application
    spec:
      containers:
        - name: cloud-application
          image: container-registry.br-se1.magalu.cloud/${MGC_REGISTRY_NAME}/cloud-application:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: url
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: cloud-application
  labels:
    app: cloud-application
spec:
  type: LoadBalancer
  selector:
    app: cloud-application
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
